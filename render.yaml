services:
  - type: web
    name: hair-beauty-store
    runtime: node
    plan: free
    buildCommand: cd render && npm ci
    startCommand: node render/server.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hair-beauty-store-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.15.0
databases:
  - name: hair-beauty-store-db
    plan: free
